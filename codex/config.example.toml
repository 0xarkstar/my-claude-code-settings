# Shape of the parts of ~/.codex/config.toml that rules/orchestration.md (Safety) relies on.
#
# WARNING. This profile removes Codex's work sandbox: Codex can write anywhere and use the
# network. What protects secrets is only the list of denied paths below plus the guidance in
# AGENTS.md, and that is weaker than the sandbox: a list can never be complete. Do not copy
# this unless that trade is what you want. If you do, the list below is a MINIMUM EXAMPLE,
# not a complete one: add every place on your machine where a key or a login token lives.
#
# This is an example, not the live file: the live table is generated from lists of the
# secret locations on one machine, and those lists are not published.

model = "gpt-6.2-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"

default_permissions = "open"

[shell_environment_policy]
# Variables that are not passed on to commands Codex starts.
exclude = ["OMC_TELEGRAM_BOT_TOKEN", "CLAUDE_CODE_MESSAGING_TOKEN"]

[permissions.open]
description = "Open work access with protections for secret stores and configuration files."

[permissions.open.filesystem]
":root" = "write"

# Key and login-token stores: unreadable. Match this to every secret location you have;
# the list should cover at least what your Claude Code deny rules cover.
"~/.aws" = "deny"
"~/.gnupg" = "deny"
"~/.secrets" = "deny"
"~/.netrc" = "deny"
"~/.ssh/id_ed25519" = "deny"            # private keys only; the SSH config stays readable
"~/.ssh/id_rsa" = "deny"
"~/.config/gh" = "deny"
"~/.config/crawl4ai" = "deny"           # an API token file of a self-hosted service
"~/.docker/config.json" = "deny"        # when it holds inline registry credentials
"~/.cargo/credentials.toml" = "deny"
"~/.codex/auth.json" = "deny"
"~/.gemini/oauth_creds.json" = "deny"
"~/.claude/.credentials.json" = "deny"
"~/.claude/.omc-config.json" = "deny"   # notification tokens
"~/.claude.json" = "deny"               # MCP server keys
"~/.zsh_history" = "deny"               # may hold a command typed with a token
"~/.bash_history" = "deny"

# Everything that carries the policy, steers a later run, or is executed later: readable,
# not writable. With ":root" = "write", anything missing here can be rewritten by a run.
# Codex itself (the folder as a whole must stay writable: sessions and state live there)
"~/.codex/config.toml" = "read"
"~/.codex/AGENTS.md" = "read"
"~/.codex/skills" = "read"
"~/.codex/prompts" = "read"
"~/.codex/high.config.toml" = "read"    # one entry for EVERY profile file you have
"~/.codex/xhigh.config.toml" = "read"
# Claude Code
"~/.claude/settings.json" = "read"
"~/.claude/CLAUDE.md" = "read"
"~/.claude/rules" = "read"
"~/.claude/hooks" = "read"
"~/.claude/agents" = "read"
"~/.claude/skills" = "read"
"~/.claude/commands" = "read"
"~/.claude/plugins" = "read"
# Shell startup files (readable, so keep tokens out of them)
"~/.zshenv" = "read"
"~/.zprofile" = "read"
"~/.zshrc" = "read"
"~/.zlogin" = "read"
"~/.bashrc" = "read"
"~/.bash_profile" = "read"
"~/.profile" = "read"
# Git configuration and hooks, launch agents, your own bin folder (hook scripts, MCP launchers)
"~/.gitconfig" = "read"
"~/.config/git" = "read"
"~/Library/LaunchAgents" = "read"
"~/.local/bin" = "read"

[permissions.open.network]
enabled = true

# Notes from applying this on Codex CLI 0.166.0:
# - Deny by path, not by pattern: a pattern also blocks creating matching files and breaks
#   dependency unpacking.
# - Do not set sandbox_mode next to this profile (in the base config or in a profile file):
#   it switches Codex back to the legacy sandbox.
# - Codex and other programs rewrite config.toml (trust entries, re-serialisation), so nothing
#   should depend on the file's bytes, spacing or comments. Check the policy by content, and
#   confirm it on the real CLI: the thread store records the policy each run started with.
# - The Codex documentation says that approved escalations use their own controls: assume a
#   command you approve to run outside the profile is not bound by this deny list.
# - Project .env files stay readable in this setup by the owner's choice; they are covered by
#   guidance in AGENTS.md only.
